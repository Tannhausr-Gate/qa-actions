name: Deploy to Elastic Beanstalk

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-2
  EB_APPLICATION_NAME: qa-actions-app
  EB_ENVIRONMENT_NAME: Qa-actions-app-env
  S3_BUCKET: qa

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.1.0

      - name: Assume role with OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package application
        run: zip -r deploy-${{ github.sha }}.zip . -x '.git/*' -x '.github/*'

      - name: Upload package to S3
        run: aws s3 cp deploy-${{ github.sha }}.zip s3://${{ env.S3_BUCKET }}/deploy-${{ github.sha }}.zip

      - name: Create new application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name ${{ env.EB_APPLICATION_NAME }} \
            --version-label ${{ github.sha }} \
            --source-bundle S3Bucket=${{ env.S3_BUCKET }},S3Key=deploy-${{ github.sha }}.zip

      - name: Deploy new version to environment
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name ${{ env.EB_ENVIRONMENT_NAME }} \
            --version-label ${{ github.sha }}

      - name: Wait for environment to be healthy
        run: |
          aws elasticbeanstalk wait environment-updated \
            --environment-name ${{ env.EB_ENVIRONMENT_NAME }}
